name: Publish Images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  NAMESPACE: ipproyectosysoluciones
  REPO: administration-meetingai

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: backend
            context: ./apps/backend
            dockerfile: Dockerfile
          - name: worker
            context: ./apps/backend
            dockerfile: Dockerfile.worker
          - name: frontend
            context: ./apps/frontend
            dockerfile: Dockerfile
    steps:
      # Tag must be strict semver (vMAJOR.MINOR.PATCH[-rc.N]); the glob "v*"
      # alone would also match "vendor", "version", etc.
      - name: Validate tag format
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error ::Tag '$TAG' is not a SemVer release tag; refusing to publish"
              exit 1
              ;;
          esac
          if [[ "$TAG" == *-* && ! "$TAG" =~ -rc\.[0-9]+$ ]]; then
            echo "::error ::Only -rc.N prerelease suffixes are publishable, got: $TAG"
            exit 1
          fi

      - name: Image coordinates
        id: vars
        env:
          IMAGE_NAME: ${{ matrix.image.name }}
          IMAGE_CONTEXT: ${{ matrix.image.context }}
        run: |
          echo "FULL_IMAGE=$REGISTRY/$NAMESPACE/$REPO-$IMAGE_NAME" \
            >> "$GITHUB_OUTPUT"
          echo "CTX=$IMAGE_CONTEXT" >> "$GITHUB_OUTPUT"
          echo "DF=$IMAGE_CONTEXT/${{ matrix.image.dockerfile }}" \
            >> "$GITHUB_OUTPUT"

      - name: Metadata (version tags)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ steps.vars.outputs.FULL_IMAGE }}
          # v0.1.0-rc.1 -> "v0.1.0-rc.1" only; stable (v1.2.3) adds "latest"
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-rc.') }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # yamllint disable-line rule:line-length

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" \
            | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ steps.vars.outputs.CTX }}
          file: ${{ steps.vars.outputs.DF }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
