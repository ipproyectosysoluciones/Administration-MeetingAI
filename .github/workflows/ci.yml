name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reunionai
          POSTGRES_PASSWORD: reunionai
          POSTGRES_DB: reunionai
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U reunionai -d reunionai"
          --health-interval 5s --health-timeout 3s --health-retries 20

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Tests
        run: pytest -q
        env:
          TEST_DATABASE_URL: >-
            postgresql+asyncpg://reunionai:reunionai@localhost:5433/reunionai

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/frontend

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Tests
        run: pnpm vitest run

      - name: Build
        run: pnpm build
