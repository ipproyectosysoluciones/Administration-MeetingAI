name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reunionai
          POSTGRES_PASSWORD: reunionai
          POSTGRES_DB: reunionai
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U reunionai -d reunionai"
          --health-interval 5s --health-timeout 3s --health-retries 20

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Tests
        run: pytest -q
        env:
          TEST_DATABASE_URL: >-
            postgresql+asyncpg://reunionai:reunionai@localhost:5433/reunionai

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/frontend

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Tests
        run: pnpm vitest run

      - name: Build
        run: pnpm build
