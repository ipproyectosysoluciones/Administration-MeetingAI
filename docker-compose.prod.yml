name: reunionai

# Production overrides:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# - No published DB port
# - APP_ENV=production forced for the backend
# - Restart policies

services:
  postgres:
    ports: []
    restart: unless-stopped

  backend:
    environment:
      APP_ENV: production
    restart: unless-stopped
    ports: []

  frontend:
    ports:
      - "80:80"
    restart: unless-stopped
